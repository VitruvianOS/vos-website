{{ if .Site.Params.topbar.enable }}
<div class="ur-topbar">
  <div class="ur-wrap ur-topbar__row">
    <div class="ur-topbar__text">{{ .Site.Params.topbar.text | safeHTML }}</div>
    <div class="ur-topbar__social">
      {{ range .Site.Menus.topbar.ByWeight }}
      <a href="{{ .URL | safeURL }}" target="_blank" rel="noopener" aria-label="{{ .Name }}">{{ .Pre | safeHTML }}</a>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
